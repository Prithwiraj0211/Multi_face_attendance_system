<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ project_name }} - Live Attendance Kiosk</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/kiosk.css">
</head>
<body>
  <div class="kiosk-container">

    <!-- Top HUD Header -->
    <header class="kiosk-header">
      <div class="kiosk-branding">
        <div class="kiosk-logo-badge">
          <svg class="ui-icon ui-icon-md" viewBox="0 0 24 24" style="color: #fff;">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m16 16-.9-.9"></path>
          </svg>
        </div>
        <div class="kiosk-title">
          <h1>VisionPass Terminal</h1>
          <p>Multi-Face Real-Time Attendance Engine</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 24px;">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em;">
          <span id="kiosk-status-dot" class="pulse-dot green"></span>
          <span id="kiosk-status-text">SYSTEM ONLINE & ACTIVE</span>
          <span id="kiosk-mode-badge" class="badge badge-info" style="margin-left: 8px; font-size: 0.72rem; padding: 3px 8px;">AUTO FLIP</span>
        </div>

        <div class="kiosk-clock-block">
          <div class="kiosk-time" id="kiosk-time">00:00:00</div>
          <div class="kiosk-date" id="kiosk-date">Loading date...</div>
        </div>
      </div>
    </header>

    <!-- Main Viewport Body -->
    <div class="kiosk-body">

      <!-- Live Stream Viewport -->
      <section class="kiosk-stream-panel">
        <div class="video-container">
          <img src="/api/stream/video_feed" class="live-feed-img" alt="Live Multi-Face Camera Stream" />
          <div class="scanline"></div>

          <!-- Floating HUD Toast (appears on face punch) -->
          <div id="kiosk-toast" class="kiosk-toast-overlay">
            <img id="kiosk-toast-avatar" class="kiosk-toast-avatar" src="" alt="Identified Employee" />
            <div class="kiosk-toast-info">
              <h4 id="kiosk-toast-name">Employee Name</h4>
              <p id="kiosk-toast-type">CHECK-IN CONFIRMED</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Side Ticker Drawer -->
      <aside class="kiosk-ticker-panel">
        <div class="ticker-header">
          <h3 style="display: flex; align-items: center; gap: 8px;">
            <svg class="ui-icon ui-icon-sm" style="color: var(--accent-cyan);" viewBox="0 0 24 24">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            Live Punch Activity
          </h3>
          <span class="badge badge-info">Live Sync</span>
        </div>

        <div class="ticker-list" id="kiosk-ticker-list">
          <div class="empty-ticker" style="color: var(--text-muted); font-size: 0.82rem; text-align: center; padding: 30px;">
            Awaiting face scans...
          </div>
        </div>
      </aside>

    </div>

    <!-- Bottom Footer Controls -->
    <footer class="kiosk-footer">
      <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
        <!-- Kiosk Mode Selector -->
        <div style="display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, 0.04); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--border-glass);">
          <button id="mode-auto" class="btn btn-sm mode-btn btn-primary" onclick="setKioskMode('AUTO')" title="Smart Alternation (Check-In -> Check-Out)">
            Auto Flip
          </button>
          <button id="mode-in" class="btn btn-sm mode-btn btn-secondary" onclick="setKioskMode('CHECK_IN')" title="All Scans Register as Check-In">
            Check-In Only
          </button>
          <button id="mode-out" class="btn btn-sm mode-btn btn-secondary" onclick="setKioskMode('CHECK_OUT')" title="All Scans Register as Check-Out">
            Check-Out Only
          </button>
        </div>

        <button id="btn-audio-toggle" class="btn btn-secondary btn-sm" onclick="toggleAudio(this)">
          <svg class="ui-icon ui-icon-xs" id="audio-icon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span id="audio-text">Voice Feedback: Active</span>
        </button>
        <button class="btn btn-secondary btn-sm" onclick="toggleFullscreen()">
          <svg class="ui-icon ui-icon-xs" viewBox="0 0 24 24">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          Fullscreen Terminal
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 16px;">
        <span style="font-size: 0.78rem; color: var(--text-muted);">
          Protected by Biometric Anti-Spoof & 512-D Vector Cryptography
        </span>
        <a href="/admin" class="btn btn-primary btn-sm">
          <svg class="ui-icon ui-icon-xs" viewBox="0 0 24 24">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Admin Console
        </a>
      </div>
    </footer>

  </div>

  <script src="/static/js/kiosk.js?v=5"></script>
</body>
</html>
