<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - {{ project_name }}</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 0 30px var(--primary-glow);
    }
    .login-header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .quick-hint {
      margin-top: 20px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.2);
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg class="ui-icon ui-icon-lg" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h1>Admin Portal</h1>
        <p>Biometric Security & Recognition Control</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            class="form-control" 
            placeholder="Enter username" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <div id="login-error" style="display: none; color: var(--accent-rose); font-size: 0.82rem; margin-bottom: 14px;"></div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          Authenticate & Access
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px;">
        <a href="/kiosk" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
          <svg class="ui-icon ui-icon-xs" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Switch to Attendance Kiosk Terminal
        </a>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      const submitBtn = document.getElementById('btn-submit');

      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const data = await API.post('/auth/login', { username, password });
        if (data.access_token) {
          localStorage.setItem('token', data.access_token);
          window.location.href = '/admin';
        }
      } catch (err) {
        errorEl.textContent = err.message || 'Authentication failed.';
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Authenticate & Access';
      }
    });
  </script>
</body>
</html>
